<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FieldProof legacy LED diagnostics</title><style>body{font:18px/1.5 system-ui;max-width:800px;margin:40px auto;padding:20px;background:#eef4f8;color:#183146}pre{white-space:pre-wrap;overflow-wrap:anywhere}a{color:#146b8d}</style><h1>Legacy LED diagnostics</h1><p>This page checks the original BLE and Wi-Fi LED path. The gateway probe creates a local unpaid quote.</p><p>Open the FieldProof dispatch desk at <a href="http://127.0.0.1:4022">localhost:4022</a> after you run the simulator.</p><pre id="status" role="status">Waiting for diagnostics.</pre><script>async function refresh(){try{const r=await fetch('/status');if(!r.ok)throw new Error(`HTTP ${r.status}`);document.getElementById('status').textContent=JSON.stringify(await r.json(),null,2);}catch(e){document.getElementById('status').textContent=e.message;}}refresh();setInterval(refresh,5000);</script></html>
