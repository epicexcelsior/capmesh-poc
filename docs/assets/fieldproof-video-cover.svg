<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">FieldProof: paid and signed, too old to use</title>
<desc id="desc">Video cover illustrating expired physical evidence. Payment remains confirmed and the device signature remains valid, but the buyer waits. This is a policy illustration, not a new measurement.</desc>
<rect width="1280" height="720" fill="#f3f3ed"/>
<g font-family="system-ui,sans-serif" fill="#183146">
<text x="54" y="72" font-size="42" font-weight="800" letter-spacing="-1.5">FieldProof</text>
<text x="54" y="113" font-size="24" fill="#39576b">Fresh physical proof for machine-to-machine commerce.</text>
<path d="M54 144H1226" stroke="#becfd9" stroke-width="2"/>
<text x="54" y="258" font-size="76" font-weight="800" letter-spacing="-3">Paid and signed.</text>
<text x="54" y="346" font-size="76" font-weight="800" letter-spacing="-3">Too old to use.</text>
<text x="54" y="410" font-size="25">A robot asks if another operator's gate is open.</text>
<text x="54" y="448" font-size="25">The buyer checks the signed answer's age.</text>
<g transform="translate(54 492)">
<text x="0" y="0" font-family="ui-monospace,monospace" font-size="15" letter-spacing="1">TEN-SECOND BUYER POLICY</text>
<rect x="0" y="22" width="440" height="14" fill="#becfd9"/>
<rect x="0" y="22" width="400" height="14" fill="#067b65"/>
<rect x="400" y="22" width="40" height="14" fill="#a35a10"/>
<path d="M400 14V44" stroke="#183146" stroke-width="3"/>
<text x="0" y="65" font-size="16" fill="#39576b">0 seconds</text>
<text x="370" y="65" font-size="16" fill="#39576b">10</text>
<text x="427" y="65" font-size="16" fill="#a35a10">11</text>
</g>
<rect x="794" y="189" width="432" height="402" rx="4" fill="#fff" stroke="#becfd9" stroke-width="2"/>
<g transform="translate(824 225)">
<text x="0" y="0" font-family="ui-monospace,monospace" font-size="14" letter-spacing="1">THE SAME OBSERVATION / 11 SECONDS OLD</text>
<path d="M0 21H372" stroke="#becfd9"/>
<g font-size="22">
<text x="0" y="62">Payment</text><text x="160" y="62" fill="#067b65" font-weight="700">CONFIRMED</text>
<text x="0" y="111">Signature</text><text x="160" y="111" fill="#067b65" font-weight="700">VALID</text>
<text x="0" y="160">Evidence</text><text x="160" y="160" fill="#a35a10" font-weight="700">EXPIRED</text>
</g>
<path d="M0 185H372" stroke="#becfd9"/>
<text x="0" y="224" font-size="18" fill="#39576b">Buyer recommendation</text>
<text x="0" y="318" font-size="88" font-weight="800" letter-spacing="-3" fill="#a35a10">WAIT</text>
</g>
<path d="M54 621H1226" stroke="#becfd9" stroke-width="2"/>
<text x="54" y="663" font-family="ui-monospace,monospace" font-size="18">SOLANA DEVNET / ESP32-SIGNED OBSERVATION / INDEPENDENT BUYER CHECKS</text>
<text x="54" y="694" font-size="14" fill="#39576b">Policy illustration. BOOT represents a gate contact. The prototype grants no access and moves no robot.</text>
</g>
</svg>
